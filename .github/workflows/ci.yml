name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  check:
    name: Check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: ""
          - os: windows-latest
            features: "--features gui"
          - os: macos-latest
            features: "--features gui"

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libglib2.0-dev libgtk-3-dev
      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Format check
        run: cargo fmt --check
      - name: Check GUI (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --features gui
      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
      - name: Test
        run: cargo test --locked ${{ matrix.features }}
      - name: Run demo CLI
        run: cargo run --locked -- --demo --json
      - name: Run fixture CLI
        run: cargo run --locked -- --mock tests/fixtures/me.json

  android-lib-check:
    name: Android library check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android
      - name: Check Android-gated library
        run: cargo check --locked --features android-gui --target aarch64-linux-android --lib
